<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D7A7C" />
    <title>Мактаби ман — платформа для школы</title>
    <meta
      name="description"
      content="Мактаби ман — платформа для школ: ученики и классы, электронный журнал, домашние задания, посещаемость, кабинеты учеников и родителей, чат с родителями."
    />

    <!-- Montserrat (заголовки, логотип) + Inter (текст) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SPA-fallback для GitHub Pages: восстанавливаем правильный путь из ?p=
      // (404.html редиректит сюда при глубоких URL)
      (function () {
        var s = window.location.search
        var m = s.match(/[?&]p=([^&]+)/)
        if (m) {
          var path = decodeURIComponent(m[1])
          var qm = s.match(/[?&]q=([^&]+)/)
          var query = qm ? '?' + decodeURIComponent(qm[1]) : ''
          window.history.replaceState(
            null,
            '',
            path + query + window.location.hash,
          )
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
