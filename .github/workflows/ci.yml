name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Отменяем предыдущий запуск той же ветки, если пришёл новый коммит.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

  backend:
    name: Backend (prisma + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      # Тесты мокают PrismaService, но импортируют enum'ы из @prisma/client —
      # поэтому клиент нужно сгенерировать перед jest.
      - name: Prisma generate
        run: npx prisma generate

      - name: Unit tests (jest)
        run: npm test
