<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>redi · KinderCRM</title>
    <script>
      // SPA-fallback для GitHub Pages.
      // GitHub Pages при глубоком URL (например /Kin/admin/timesheet) отдаёт
      // этот файл. Мы перенаправляем на корень с параметром ?p=<путь>,
      // а главный index.html прочитает p и восстановит правильный history.
      (function () {
        var segments = window.location.pathname.split('/').slice(2).join('/')
        var search = window.location.search
        var hash = window.location.hash
        window.location.replace(
          '/Kin/?p=/' + segments + (search ? '&q=' + search.slice(1) : '') + hash,
        )
      })()
    </script>
  </head>
  <body>
    Loading…
  </body>
</html>
